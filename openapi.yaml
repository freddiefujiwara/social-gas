openapi: 3.0.0
info:
  title: Social Data API (GA4 bridge + SNS counts)
  version: 1.1.0
  description: |
    Google Apps Script Web App with two surfaces:

    - With no `action` parameter, it runs a GA4 Data API runReport for
      the property configured in the GA4_PROPERTY_ID Script Property
      and returns the result as JSON (the parameters below).
    - With an `action` parameter, it serves the SNS collection data
      and account actions: bootstrap, sns_counts, sns_detail,
      sns_history, top_articles, music_count, comments_rss, perf_rss,
      record_smoke, exchange_session, issue_share, revoke_session,
      revoke_share. The action shapes are documented in the README.
servers:
  - url: https://script.google.com/macros/s/<deployment-id>/exec
    description: Google Apps Script web app deployment (replace with the actual deployment URL)
paths:
  /exec:
    get:
      summary: Run a GA4 report
      description: |
        Runs a GA4 Data API runReport for the property configured in the
        GA4_PROPERTY_ID Script Property and returns the result as JSON.
      parameters:
        - name: action
          in: query
          description: SNS/account action to perform. Omit for the GA4 report below.
          required: false
          schema:
            type: string
            enum: [bootstrap, sns_counts, sns_detail, sns_history, top_articles, music_count, comments_rss, perf_rss, record_smoke, exchange_session, issue_share, revoke_session, revoke_share]
        - name: start
          in: query
          description: Start date, a GA4 date expression (e.g. 28daysAgo) or YYYY-MM-DD.
          required: false
          schema:
            type: string
            default: 28daysAgo
        - name: end
          in: query
          description: End date, a GA4 date expression (e.g. today) or YYYY-MM-DD.
          required: false
          schema:
            type: string
            default: today
        - name: metrics
          in: query
          description: Comma-separated GA4 metric names.
          required: false
          schema:
            type: string
            default: screenPageViews,activeUsers,sessions
        - name: dimensions
          in: query
          description: Comma-separated GA4 dimension names. Empty means totals only.
          required: false
          schema:
            type: string
            default: pagePath
        - name: limit
          in: query
          description: Maximum number of rows.
          required: false
          schema:
            type: integer
            default: 25
        - name: offset
          in: query
          description: Row offset for paging together with limit.
          required: false
          schema:
            type: integer
            default: 0
        - name: filter
          in: query
          description: Dimension filter clauses separated by ";", each "<dimension>:<matchType>:<value>" with matchType one of exact, contains, beginsWith, endsWith, regexp. Multiple clauses are combined with AND.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: JSON with ok=true and the runReport result under data, or ok=false with an error.
          content:
            application/json:
              schema:
                type: object
